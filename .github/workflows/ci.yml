name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: online_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d online_pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pos:pos@localhost:5432/online_pos?schema=public
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm --filter @online-pos/database generate
      - run: pnpm --filter @online-pos/domain test
      - run: pnpm --filter @online-pos/api build
      - run: pnpm --filter @online-pos/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
